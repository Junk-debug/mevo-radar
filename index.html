<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MEVO Route Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fff;
    color: #222;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column
  }

  #map {
    flex: 1;
    z-index: 0
  }

  .panel {
    background: #fff;
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -2px 16px rgba(0, 0, 0, .1);
    padding: 14px 16px 10px;
    z-index: 1000;
    max-height: 52vh;
    overflow-y: auto;
    transition: max-height .3s
  }

  .panel.mini {
    max-height: 56px;
    overflow: hidden
  }

  .handle {
    width: 36px;
    height: 4px;
    background: #ccc;
    border-radius: 2px;
    margin: 0 auto 10px;
    cursor: pointer
  }

  label {
    font-size: 11px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: .4px;
    display: block;
    margin-bottom: 3px
  }

  .irow {
    display: flex;
    gap: 6px;
    margin-bottom: 8px
  }

  .irow input {
    flex: 1;
    padding: 9px 11px;
    border: 1.5px solid #ddd;
    border-radius: 9px;
    font-size: 14px;
    outline: none
  }

  .irow input:focus {
    border-color: #E63946
  }

  .loc {
    width: 40px;
    height: 40px;
    border: 1.5px solid #ddd;
    border-radius: 9px;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 17px
  }

  .sug {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 9px;
    max-height: 140px;
    overflow-y: auto;
    z-index: 2000;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    display: none
  }

  .sug.on {
    display: block
  }

  .sug div {
    padding: 9px 11px;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 1px solid #f5f5f5
  }

  .sug div:active {
    background: #f5f5f5
  }

  .ig {
    position: relative;
    margin-bottom: 8px
  }

  .tog {
    display: flex;
    gap: 5px;
    margin-bottom: 10px
  }

  .tog button {
    flex: 1;
    padding: 7px;
    border: 1.5px solid #ddd;
    border-radius: 9px;
    background: #fff;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer
  }

  .tog button.on {
    border-color: #E63946;
    background: #E63946;
    color: #fff
  }

  .go {
    width: 100%;
    padding: 11px;
    background: #E63946;
    color: #fff;
    border: none;
    border-radius: 11px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer
  }

  .go:disabled {
    background: #ccc
  }

  .go:active:not(:disabled) {
    opacity: .8
  }

  .res {
    background: #f8f9fa;
    border-radius: 11px;
    padding: 11px;
    margin-top: 8px;
    display: none
  }

  .res.on {
    display: block
  }

  .segs {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap
  }

  .seg {
    flex: 1;
    min-width: 70px;
    padding: 7px;
    border-radius: 7px;
    text-align: center
  }

  .seg .i {
    font-size: 18px
  }

  .seg .t {
    font-weight: 700;
    font-size: 14px
  }

  .seg .d {
    font-size: 10px;
    color: #888
  }

  .sw {
    background: #dbeafe
  }

  .sb {
    background: #d1fae5
  }

  .sc {
    background: #fff;
    border: 1.5px solid #e0e0e0;
    border-radius: 9px;
    padding: 9px 10px;
    margin-bottom: 6px
  }

  .sc h4 {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 3px
  }

  .sc .av {
    display: flex;
    gap: 10px;
    font-size: 11px
  }

  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 3px;
    vertical-align: middle
  }

  .dg {
    background: #2a9d8f
  }

  .dy {
    background: #e9c46a
  }

  .dr {
    background: #E63946
  }

  .warn {
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 11px;
    margin-bottom: 6px
  }

  .gm {
    width: 100%;
    padding: 11px;
    background: #1d3557;
    color: #fff;
    border: none;
    border-radius: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px
  }

  .gm:active {
    opacity: .8
  }

  .ld {
    display: none;
    text-align: center;
    padding: 16px;
    color: #888
  }

  .ld.on {
    display: block
  }

  .sp {
    display: inline-block;
    width: 22px;
    height: 22px;
    border: 3px solid #ddd;
    border-top-color: #E63946;
    border-radius: 50%;
    animation: sp .7s linear infinite
  }

  @keyframes sp {
    to {
      transform: rotate(360deg)
    }
  }

  .err {
    background: #fde8e8;
    border: 1px solid #E63946;
    border-radius: 7px;
    padding: 7px 9px;
    font-size: 11px;
    color: #b91c1c;
    margin-bottom: 6px;
    display: none
  }

  .err.on {
    display: block
  }

  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: #aaa;
    margin-bottom: 6px
  }

  .meta button {
    background: none;
    border: none;
    color: #E63946;
    font-weight: 600;
    cursor: pointer;
    font-size: 10px
  }
</style>
</head>
<body>

<div id="map"></div>
<div class="panel" id="P">
  <div class="handle" onclick="document.getElementById('P').classList.toggle('mini')"></div>
  <div class="err" id="E"></div>
  <div class="meta" id="M" style="display:none">
    <span>MEVO: <b id="UT">—</b> · <span id="SC">0</span> stacji</span>
    <button onclick="loadData()">⟳ Odśwież</button>
  </div>
  <div class="ig"><label>Skąd</label>
    <div class="irow"><input id="FI" placeholder="Adres lub miejsce..." autocomplete="off" /><button class="loc"
        onclick="geoMe()">📍</button></div>
    <div class="sug" id="FS"></div>
  </div>
  <div class="ig"><label>Dokąd</label>
    <div class="irow"><input id="TI" placeholder="Adres lub miejsce..." autocomplete="off" /></div>
    <div class="sug" id="TS"></div>
  </div>
  <div class="tog" id="BT">
    <button class="on" data-t="any">Dowolny</button>
    <button data-t="electric">⚡ Elektr.</button>
    <button data-t="classic">🚲 Klasyczny</button>
  </div>
  <button class="go" onclick="plan()">Wyznacz trasę</button>
  <div class="ld" id="L">
    <div class="sp"></div><br>Szukam trasy...
  </div>
  <div class="res" id="R">
    <div class="segs" id="SG"></div>
    <div id="W"></div>
    <div id="CS"></div>
    <button class="gm" onclick="gm()">🗺️ Otwórz w Google Maps</button>
  </div>
</div>

<script>
  let map, S = [], FC = null, TC = null, BT = 'any', RD = null, RL = [], ML = [], ST = null;
  const GD = [54.372, 18.638];

  map = L.map('map', { zoomControl: false }).setView(GD, 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM', maxZoom: 19 }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);

  // Bike toggle
  document.querySelectorAll('.tog button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tog button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); BT = b.dataset.t;
  });

  // Autocomplete
  function setupAC(inp, box, setC) {
    let t;
    inp.addEventListener('input', () => {
      clearTimeout(t); const q = inp.value.trim();
      if (q.length < 3) { box.classList.remove('on'); return }
      t = setTimeout(async () => {
        try {
          const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=5&countrycodes=pl&viewbox=18.2,54.1,18.9,54.6&bounded=1`, { headers: { 'Accept-Language': 'pl' } });
          const d = await r.json(); box.innerHTML = '';
          d.forEach(p => {
            const v = document.createElement('div');
            v.textContent = p.display_name.split(',').slice(0, 3).join(', ');
            v.onclick = () => { inp.value = v.textContent; setC([+p.lat, +p.lon]); box.classList.remove('on') };
            box.appendChild(v);
          });
          if (d.length) box.classList.add('on');
        } catch (e) { }
      }, 350);
    });
    document.addEventListener('click', e => { if (e.target !== inp && !box.contains(e.target)) box.classList.remove('on') });
  }
  setupAC(document.getElementById('FI'), document.getElementById('FS'), c => { FC = c });
  setupAC(document.getElementById('TI'), document.getElementById('TS'), c => { TC = c });

  function geoMe() {
    navigator.geolocation?.getCurrentPosition(p => {
      FC = [p.coords.latitude, p.coords.longitude];
      document.getElementById('FI').value = '📍 Moja lokalizacja';
    }, () => err('Geolokalizacja niedostępna'));
  }

  function err(m) { const e = document.getElementById('E'); e.textContent = m; e.classList.add('on') }
  function clrErr() { document.getElementById('E').classList.remove('on') }

  // Load data
  async function loadData() {
    try {
      const r = await fetch('mevo-data.json');
      if (!r.ok) throw new Error('Brak pliku mevo-data.json');
      const d = await r.json();
      S = d.stations.filter(s => s.active !== false);
      document.getElementById('M').style.display = 'flex';
      document.getElementById('UT').textContent = new Date(d.updated).toLocaleString('pl-PL');
      document.getElementById('SC').textContent = S.length;
      clrErr();
    } catch (e) {
      err('Brak danych. Uruchom: node fetch-data.js');
    }
  }

  // Haversine
  function hav(a, b) {
    const R = 6371e3, r = x => x * Math.PI / 180, dL = r(b[0] - a[0]), dN = r(b[1] - a[1]);
    const h = Math.sin(dL / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dN / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  function bikesAt(s, t) {
    if (t === 'electric') return s.ebikes;
    if (t === 'classic') return s.bikes;
    return s.bikes + s.ebikes;
  }

  function findSt(c, mode, t) {
    let best = null, bd = Infinity;
    S.forEach(s => {
      const d = hav(c, [s.lat, s.lon]);
      if (d > 3000) return;
      if (mode === 'pick' && bikesAt(s, t) < 1) return;
      if (mode === 'drop' && s.docks < 1) return;
      if (d < bd) { bd = d; best = { ...s, dist: d }; }
    });
    return best;
  }

  async function route(a, b, m) {
    const p = m === 'walk' ? 'foot' : 'bike';
    try {
      const r = await fetch(`https://router.project-osrm.org/route/v1/${p}/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
      const d = await r.json();
      if (d.routes?.[0]) return { geo: d.routes[0].geometry, dist: d.routes[0].distance, dur: d.routes[0].duration };
    } catch (e) { }
    const dist = hav(a, b) * 1.3, spd = m === 'walk' ? 1.4 : 4.2;
    return { geo: null, dist, dur: dist / spd };
  }

  function clrMap() { RL.forEach(l => map.removeLayer(l)); ML.forEach(l => map.removeLayer(l)); RL = []; ML = []; }

  function ico(e, sz = 26) { return L.divIcon({ html: `<div style="font-size:${sz}px;line-height:1;text-align:center">${e}</div>`, iconSize: [sz, sz], iconAnchor: [sz / 2, sz], className: '' }) }
  function stIco(lv) { const c = { g: '#2a9d8f', y: '#e9c46a', r: '#E63946' }[lv]; return L.divIcon({ html: `<div style="width:12px;height:12px;background:${c};border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3)"></div>`, iconSize: [12, 12], iconAnchor: [6, 6], className: '' }) }
  function lv(n) { return n === 0 ? 'r' : n <= 2 ? 'y' : 'g' }
  function dot(l) { return `<span class="dot d${l}"></span>` }

  async function plan() {
    clrErr();
    if (!FC || !TC) { err('Podaj start i cel'); return }
    if (!S.length) { err('Brak danych — uruchom: node fetch-data.js'); return }
    const ld = document.getElementById('L'), rs = document.getElementById('R');
    rs.classList.remove('on'); ld.classList.add('on'); clrMap();

    try {
      const pk = findSt(FC, 'pick', BT), dr = findSt(TC, 'drop', BT);
      if (!pk) { ld.classList.remove('on'); err('Brak stacji z rowerami w pobliżu (3 km)'); return }
      if (!dr) { ld.classList.remove('on'); err('Brak stacji z dokami w pobliżu celu (3 km)'); return }

      const [s1, s2, s3] = await Promise.all([
        route(FC, [pk.lat, pk.lon], 'walk'),
        route([pk.lat, pk.lon], [dr.lat, dr.lon], 'bike'),
        route([dr.lat, dr.lon], TC, 'walk')
      ]);
      RD = { from: FC, to: TC, pk, dr, s1, s2, s3 };

      // Draw routes
      const col = ['#3b82f6', '#10b981', '#3b82f6'], pts = [[FC, [pk.lat, pk.lon]], [[pk.lat, pk.lon], [dr.lat, dr.lon]], [[dr.lat, dr.lon], TC]];
      [s1, s2, s3].forEach((s, i) => {
        const ll = s.geo?.coordinates ? s.geo.coordinates.map(c => [c[1], c[0]]) : pts[i];
        RL.push(L.polyline(ll, { color: col[i], weight: i === 1 ? 5 : 4, opacity: .8, dashArray: i !== 1 ? '6,8' : null }).addTo(map));
      });

      ML.push(L.marker(FC, { icon: ico('🟢', 24) }).addTo(map));
      ML.push(L.marker(TC, { icon: ico('🏁', 24) }).addTo(map));
      const plv = lv(bikesAt(pk, BT)), dlv = lv(dr.docks);
      ML.push(L.marker([pk.lat, pk.lon], { icon: stIco(plv) }).addTo(map).bindPopup(`<b>${pk.name}</b><br>🚲 ${bikesAt(pk, BT)}`));
      ML.push(L.marker([dr.lat, dr.lon], { icon: stIco(dlv) }).addTo(map).bindPopup(`<b>${dr.name}</b><br>🅿️ ${dr.docks}`));

      // Dim other stations
      S.forEach(s => {
        if (s.id === pk.id || s.id === dr.id) return;
        const m = L.circleMarker([s.lat, s.lon], { radius: 3, color: '#bbb', fillColor: '#ddd', fillOpacity: .5, weight: 1 }).addTo(map);
        m.bindPopup(`<b>${s.name}</b><br>🚲 ${s.bikes + s.ebikes} | 🅿️ ${s.docks}`);
        ML.push(m);
      });

      map.fitBounds([FC, [pk.lat, pk.lon], [dr.lat, dr.lon], TC], { padding: [30, 30] });

      // Summary
      const fm = s => { const m = Math.round(s / 60); return m < 60 ? m + ' min' : `${~~(m / 60)}h ${m % 60}min` };
      const fd = m => m < 1000 ? Math.round(m) + 'm' : (m / 1000).toFixed(1) + 'km';
      document.getElementById('SG').innerHTML = `
      <div class="seg sw"><div class="i">🚶</div><div class="t">${fm(s1.dur)}</div><div class="d">${fd(s1.dist)}</div></div>
      <div class="seg sb"><div class="i">🚲</div><div class="t">${fm(s2.dur)}</div><div class="d">${fd(s2.dist)}</div></div>
      <div class="seg sw"><div class="i">🚶</div><div class="t">${fm(s3.dur)}</div><div class="d">${fd(s3.dist)}</div></div>`;

      // Warnings
      let w = ''; const pb = bikesAt(pk, BT), dd = dr.docks;
      if (pb <= 2) w += `<div class="warn">⚠️ Niewiele rowerów na <b>${pk.name}</b> (${pb}) — <a href="rowermevo://stations/${pk.id}">zarezerwuj w MEVO</a></div>`;
      if (dd <= 2) {
        const alt = S.filter(s => s.id !== dr.id && s.docks >= 3).map(s => ({ ...s, d: hav(TC, [s.lat, s.lon]) })).sort((a, b) => a.d - b.d)[0];
        w += `<div class="warn">⚠️ Mało doków na <b>${dr.name}</b> (${dd}).${alt ? ` Alternatywa: <b>${alt.name}</b> (${alt.docks} doków)` : ''}</div>`;
      }
      document.getElementById('W').innerHTML = w;

      // Station cards
      document.getElementById('CS').innerHTML = `
      <div class="sc"><h4>🅰️ ${pk.name}</h4><div class="av"><span>${dot(plv)} ⚡${pk.ebikes} 🚲${pk.bikes}</span><span>${dot(lv(pk.docks))} 🅿️${pk.docks}</span></div></div>
      <div class="sc"><h4>🅱️ ${dr.name}</h4><div class="av"><span>${dot(lv(dr.bikes + dr.ebikes))} ⚡${dr.ebikes} 🚲${dr.bikes}</span><span>${dot(dlv)} 🅿️${dr.docks}</span></div></div>`;

      rs.classList.add('on');
    } catch (e) { err('Błąd: ' + e.message) }
    finally { ld.classList.remove('on') }
  }

  function gm() {
    if (!RD) return;
    const { from, to, pk, dr } = RD;
    window.open(`https://www.google.com/maps/dir/?api=1&origin=${from[0]},${from[1]}&destination=${to[0]},${to[1]}&waypoints=${pk.lat},${pk.lon}|${dr.lat},${dr.lon}&travelmode=bicycling`, '_blank');
  }

  loadData();
</script>

</body>
</html>
