name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Shows the live URL on the run page and under "Deployments" in the repo sidebar.
    environment:
      name: production
      url: https://mevoradar.pl
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Needs repository secrets CLOUDFLARE_API_TOKEN (Workers edit + KV) and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The build writes the deployable config (with the assets dir) next to the Worker bundle.
          command: deploy --config dist/mevo_radar/wrangler.json

      - name: Summary
        env:
          OUTPUT: ${{ steps.deploy.outputs.command-output }}
          WORKERS_DEV: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          version=$(printf '%s\n' "$OUTPUT" | sed -n 's/.*Current Version ID: *//p' | head -1)
          domains=$(printf '%s\n' "$OUTPUT" | sed -n 's/^ *\([a-z0-9.-]*\) (custom domain).*/\1/p')
          {
            echo "## 🚲 MEVO Radar deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            for d in $domains; do echo "| Site | https://$d |"; done
            if [ -n "$WORKERS_DEV" ]; then echo "| workers.dev | $WORKERS_DEV |"; fi
            echo "| Commit | [\`${GITHUB_SHA::7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            if [ -n "$version" ]; then echo "| Worker version | \`$version\` |"; fi
            echo "| Cron | every 2 min (station bike numbers → KV) |"
            echo
            echo "[Cloudflare dashboard](https://dash.cloudflare.com/d146ce751b7271b0d43751c28b6edd92/workers/services/view/mevo-radar/production)"
          } >> "$GITHUB_STEP_SUMMARY"
